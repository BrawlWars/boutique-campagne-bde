<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique BDE</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#12263a;--mute:#5b6b7a;--line:#d9e1e8;--acc:#0f766e;--acc2:#f4a62a;--bad:#b42318;--ok:#067647}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a26;--card:#16273a;--ink:#e8eef4;--mute:#9db0c2;--line:#27405a;--acc:#2dd4bf;--acc2:#f4a62a;--bad:#ff8a80;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Space Grotesk",system-ui,sans-serif;padding-bottom:90px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:3px solid var(--acc)}
h1{margin:0;font-size:22px}h2{margin:26px 0 10px;font-size:18px}
main{max-width:860px;margin:0 auto;padding:0 14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.p:disabled{opacity:.4;cursor:not-allowed}
button.d{color:var(--bad)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.prod b{display:block}.mute{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:8px}
.q{display:flex;align-items:center;gap:6px}.q button{width:34px;padding:6px 0}.q span{min-width:22px;text-align:center;font-weight:700}
.tag{font-size:12px;border:1px solid var(--acc2);color:var(--acc2);border-radius:99px;padding:1px 8px;margin-left:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--acc2);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tot{font-size:22px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button.on{background:var(--ink);color:var(--bg)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
td input{width:100%}.low{color:var(--bad);font-weight:700}
.st{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--line)}
.ok{background:var(--ok);color:#fff}.no{background:var(--bad);color:#fff}
.note{background:var(--card);border-left:4px solid var(--acc2);padding:10px 12px;margin:12px 0;border-radius:6px;font-size:14px}
</style>
</head>
<body>
<header><h1>Boutique BDE</h1><button id="mode" onclick="toggleAdmin()">Admin</button></header>
<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== CONFIG =====
   Pour synchroniser les stocks avec l'appli campagne BDE : colle ici la config Firebase
   du projet (Paramètres du projet > Vos applications). Laisse null pour un test local. */
const FIREBASE_CONFIG = null;
const DOC_PATH = 'boutique/main';

const DEF = {
  code: 'bde2026',
  cats: [
    {id:'c1', name:'Boissons', adult:false},
    {id:'c2', name:'Snacks', adult:false},
    {id:'c3', name:'Goodies BDE', adult:false},
    {id:'c4', name:'Autres', adult:false}
  ],
  prods: [
    {id:'p1', cat:'c1', name:'Eau 50 cl', price:1, stock:50},
    {id:'p2', cat:'c1', name:'Soda 33 cl', price:1.5, stock:40},
    {id:'p3', cat:'c2', name:'Paquet de chips', price:1.2, stock:30},
    {id:'p4', cat:'c3', name:'T-shirt BDE', price:12, stock:15}
  ],
  orders: []
};
const STATUTS = {nouvelle:'Nouvelle', payee:'Payée', remise:'Remise', annulee:'Annulée'};
let S = JSON.parse(JSON.stringify(DEF)), db = null, ref = null;
let cart = {}, admin = false, tab = 'orders', done = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (Math.round(n*100)/100).toFixed(2).replace('.', ',') + ' €';
const uid = () => Math.random().toString(36).slice(2, 9);

async function init() {
  if (FIREBASE_CONFIG) {
    firebase.initializeApp(FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    db = firebase.firestore(); ref = db.doc(DOC_PATH);
    const s = await ref.get();
    if (!s.exists) await ref.set(DEF);
    ref.onSnapshot(d => { S = d.data(); render(); });
  } else {
    try { S = JSON.parse(localStorage.getItem('boutique-bde')) || S; } catch (e) {}
    render();
  }
}
async function mutate(fn) {
  if (db) {
    await db.runTransaction(async t => { const d = await t.get(ref); const s = d.data(); fn(s); t.set(ref, s); });
  } else {
    fn(S);
    try { localStorage.setItem('boutique-bde', JSON.stringify(S)); } catch (e) {}
    render();
  }
}
const catOf = id => S.cats.find(c => c.id === id);
const total = () => Object.entries(cart).reduce((t,[id,q]) => t + q * (S.prods.find(p => p.id === id)?.price || 0), 0);
const needAdult = () => Object.keys(cart).some(id => { const p = S.prods.find(p => p.id === id); return p && catOf(p.cat)?.adult; });

function toggleAdmin() {
  if (admin) { admin = false; }
  else { const c = prompt('Code admin :'); if (c === null) return; if (c !== S.code) { alert('Code incorrect.'); return; } admin = true; }
  document.getElementById('mode').textContent = admin ? 'Retour boutique' : 'Admin';
  render();
}
function render() { document.getElementById('app').innerHTML = admin ? adminView() : shopView(); }

/* ===== BOUTIQUE ===== */
function shopView() {
  if (done) return `<h2>Commande n°${done.n} enregistrée</h2><div class="card"><p>Merci ${esc(done.name)} !</p><p class="tot">${eur(done.total)}</p><p class="mute">À régler directement auprès du BDE lors de la remise.</p><button class="p" onclick="done=null;render()">Nouvelle commande</button></div>`;
  let h = '';
  S.cats.forEach(c => {
    const ps = S.prods.filter(p => p.cat === c.id);
    if (!ps.length) return;
    h += `<h2>${esc(c.name)}${c.adult ? '<span class="tag">18+</span>' : ''}</h2><div class="grid">`;
    ps.forEach(p => {
      const q = cart[p.id] || 0;
      h += `<div class="card prod"><b>${esc(p.name)}</b><span class="mute">${eur(p.price)} · ${p.stock > 0 ? p.stock + ' en stock' : 'épuisé'}</span>
      <div class="row"><div class="q"><button onclick="chg('${p.id}',-1)" ${q?'':'disabled'}>−</button><span>${q}</span><button onclick="chg('${p.id}',1)" ${q>=p.stock?'disabled':''}>+</button></div><b>${q ? eur(q*p.price) : ''}</b></div></div>`;
    });
    h += '</div>';
  });
  const n = Object.values(cart).reduce((a,b) => a+b, 0);
  h += `<div class="card" style="margin-top:20px"><b>Tes infos</b><div class="row"><input id="cname" placeholder="Prénom et nom" style="flex:1"></div>
  ${needAdult() ? '<label class="row" style="justify-content:flex-start"><input type="checkbox" id="adult"> Je confirme avoir 18 ans ou plus (produits 18+ dans le panier)</label>' : ''}
  <p class="mute">Le paiement se fait directement avec le BDE, pas en ligne.</p></div>
  <div class="bar"><div><span class="mute">${n} article${n>1?'s':''}</span><div class="tot">${eur(total())}</div></div><button class="p" ${n?'':'disabled'} onclick="order()">Commander</button></div>`;
  return h;
}
function chg(id, d) {
  const p = S.prods.find(p => p.id === id); const q = Math.max(0, Math.min(p.stock, (cart[id] || 0) + d));
  if (q) cart[id] = q; else delete cart[id];
  const name = document.getElementById('cname')?.value; render();
  if (name) document.getElementById('cname').value = name;
}
async function order() {
  const name = document.getElementById('cname').value.trim();
  if (!name) { alert('Indique ton nom pour la commande.'); return; }
  if (needAdult() && !document.getElementById('adult')?.checked) { alert('Confirme ta majorité pour les produits 18+.'); return; }
  let res;
  try {
    await mutate(s => {
      const items = [];
      for (const [id, q] of Object.entries(cart)) {
        const p = s.prods.find(p => p.id === id);
        if (!p || p.stock < q) throw new Error('Stock insuffisant pour ' + (p ? p.name : 'un produit'));
        p.stock -= q; items.push({pid:id, name:p.name, price:p.price, q});
      }
      const n = s.orders.length + 1;
      res = {id:uid(), n, ts:Date.now(), name, items, total:items.reduce((t,i) => t + i.q*i.price, 0), status:'nouvelle'};
      s.orders.push(res);
    });
  } catch (e) { alert(e.message); return; }
  cart = {}; done = res; render();
}

/* ===== ADMIN ===== */
function adminView() {
  const T = (k, l) => `<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`;
  let h = `<div class="tabs">${T('orders','Commandes')}${T('stock','Stock')}${T('cats','Catégories')}${T('set','Réglages')}</div>`;
  if (tab === 'orders') {
    const enc = S.orders.filter(o => o.status==='payee'||o.status==='remise').reduce((t,o) => t+o.total, 0);
    const att = S.orders.filter(o => o.status==='nouvelle').length;
    h += `<div class="note">${S.orders.length} commande(s) · ${att} à traiter · ${eur(enc)} encaissés</div>`;
    if (!S.orders.length) h += '<p class="mute">Aucune commande pour l\'instant.</p>';
    [...S.orders].reverse().forEach(o => {
      h += `<div class="card" style="margin-bottom:8px"><div class="row" style="margin:0"><b>n°${o.n} · ${esc(o.name)}</b><span class="st ${o.status==='remise'?'ok':o.status==='annulee'?'no':''}">${STATUTS[o.status]}</span></div>
      <div class="mute">${new Date(o.ts).toLocaleString('fr-FR')}</div>
      <div>${o.items.map(i => `${i.q} × ${esc(i.name)}`).join(', ')}</div>
      <div class="row"><b>${eur(o.total)}</b><select onchange="setStatus('${o.id}',this.value)">${Object.entries(STATUTS).map(([k,v]) => `<option value="${k}" ${k===o.status?'selected':''}>${v}</option>`).join('')}</select></div></div>`;
    });
  }
  if (tab === 'stock') {
    h += `<div class="scroll"><table><tr><th>Produit</th><th>Catégorie</th><th>Prix €</th><th>Stock</th><th></th></tr>`;
    S.prods.forEach(p => {
      h += `<tr><td><input value="${esc(p.name)}" onchange="upd('${p.id}','name',this.value)"></td>
      <td><select onchange="upd('${p.id}','cat',this.value)">${S.cats.map(c => `<option value="${c.id}" ${c.id===p.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></td>
      <td><input type="number" step="0.05" min="0" value="${p.price}" onchange="upd('${p.id}','price',parseFloat(this.value)||0)" style="width:80px"></td>
      <td><input type="number" min="0" value="${p.stock}" class="${p.stock<=3?'low':''}" onchange="upd('${p.id}','stock',Math.max(0,parseInt(this.value)||0))" style="width:80px"></td>
      <td><button class="d" onclick="delProd('${p.id}')">Supprimer</button></td></tr>`;
    });
    h += `</table></div><p><button class="p" onclick="addProd()">Ajouter un produit</button></p><p class="mute">Les stocks en rouge sont à 3 ou moins. Chaque commande déduit le stock, une annulation le remet.</p>`;
  }
  if (tab === 'cats') {
    h += `<p class="mute">Renomme les 4 catégories. « 18+ » ajoute une confirmation de majorité à la commande.</p>`;
    S.cats.forEach(c => {
      h += `<div class="card row"><input value="${esc(c.name)}" onchange="updCat('${c.id}','name',this.value)" style="flex:1"><label><input type="checkbox" ${c.adult?'checked':''} onchange="updCat('${c.id}','adult',this.checked)"> 18+</label></div>`;
    });
  }
  if (tab === 'set') {
    h += `<div class="card"><b>Code admin</b><div class="row"><input id="ncode" value="${esc(S.code)}"><button class="p" onclick="setCode()">Changer</button></div>
    <p class="mute">Ce code protège l'interface mais pas la base : verrouille aussi les règles Firestore.</p></div>
    <p><button onclick="csv()">Exporter les commandes (CSV)</button></p>`;
  }
  return h;
}
const setStatus = (id, st) => mutate(s => {
  const o = s.orders.find(o => o.id === id); if (!o) return;
  if (st === 'annulee' && o.status !== 'annulee') o.items.forEach(i => { const p = s.prods.find(p => p.id === i.pid); if (p) p.stock += i.q; });
  if (o.status === 'annulee' && st !== 'annulee') o.items.forEach(i => { const p = s.prods.find(p => p.id === i.pid); if (p) p.stock = Math.max(0, p.stock - i.q); });
  o.status = st;
});
const upd = (id, k, v) => mutate(s => { const p = s.prods.find(p => p.id === id); if (p) p[k] = v; });
const updCat = (id, k, v) => mutate(s => { const c = s.cats.find(c => c.id === id); if (c) c[k] = v; });
const addProd = () => mutate(s => s.prods.push({id:uid(), cat:s.cats[0].id, name:'Nouveau produit', price:1, stock:0}));
const delProd = id => { if (confirm('Supprimer ce produit ?')) mutate(s => { s.prods = s.prods.filter(p => p.id !== id); }); };
const setCode = () => { const v = document.getElementById('ncode').value.trim(); if (v.length >= 4) mutate(s => { s.code = v; }); else alert('4 caractères minimum.'); };
function csv() {
  const rows = [['n','date','nom','articles','total','statut']];
  S.orders.forEach(o => rows.push([o.n, new Date(o.ts).toISOString(), o.name, o.items.map(i => i.q+'x '+i.name).join(' | '), o.total, STATUTS[o.status]]));
  const t = rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + t], {type:'text/csv'})); a.download = 'commandes-bde.csv'; a.click();
}
init();
</script>
</body>
</html>
